<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Registration – GymCare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body style="background-color: var(--color-light-grey);">

  <!-- Minimal Nav -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand">
        <span class="brand-icon">🏋️</span>
        <span>GymCare</span>
      </a>
      <div>
        <a href="/" class="btn btn-outline btn-sm">← Back to Home</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="form-card" style="max-width: 620px;">
      <div class="form-header">
        <h2>Join GymCare Today</h2>
        <p>Create your member account to choose a fitness plan and track your gym sessions.</p>
      </div>

      <div id="alert-box" class="alert"></div>

      <form id="register-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
          </div>
          <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" class="form-control" placeholder="e.g. ramesh_k" required>
            <small class="form-helper">Letters, numbers, and underscores only</small>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="ramesh@example.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" required>
          </div>
        </div>

        <div class="form-group">
          <label for="address">Residential Address *</label>
          <input type="text" id="address" class="form-control" placeholder="House/Flat No, Street, City" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Create My Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-border); font-size: 0.95rem;">
        Already have an account? <a href="/login.html" style="font-weight: 600;">Log In here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
