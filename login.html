<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Login – GymCare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body style="background-color: var(--color-light-grey);">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand">
        <span class="brand-icon">🏋️</span>
        <span>GymCare</span>
      </a>
      <div>
        <a href="/" class="btn btn-outline btn-sm">← Back to Home</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="form-card">
      <div class="form-header">
        <h2>Member Login</h2>
        <p>Access your GymCare membership dashboard, payments, and attendance.</p>
      </div>

      <div id="alert-box" class="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="identifier">Username or Email Address</label>
          <input type="text" id="identifier" class="form-control" placeholder="Enter your username or email" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-border); font-size: 0.95rem;">
        Don't have an account yet? <a href="/register.html" style="font-weight: 600;">Register as a Member</a>
      </div>

      <div style="text-align: center; margin-top: 16px; background-color: var(--color-light-grey); padding: 12px; border-radius: var(--radius-sm); font-size: 0.88rem;">
        Are you gym staff or administrator? <br>
        <a href="/admin-login.html" style="font-weight: 700; color: var(--color-navy);">Go to Admin Portal →</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
